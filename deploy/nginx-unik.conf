# /etc/nginx/sites-available/unik   (lalu: ln -s ke sites-enabled, nginx -t, systemctl reload nginx)
# Kalau port 8080 sudah dipakai layanan lain, ganti ke 8081 di sini DAN di Cloudflare Tunnel (Public Hostname).
# Nginx hanya mendengarkan di 127.0.0.1:8080; trafik publik masuk lewat Cloudflare Tunnel.
# Domain sudah diisi. Folder project: /var/www/unik (path yang sama dipakai di dalam container PHP).

map $request_uri $unik_csp {
    # panel admin (Filament/Livewire) butuh script yang lebih longgar, jadi tanpa CSP
    ~^/(admin|livewire|filament) "";
    default "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'";
}

# Permintaan dengan Host yang bukan domain lu ditolak
server {
    listen 127.0.0.1:8080 default_server;
    server_name _;
    return 444;
}

server {
    listen 127.0.0.1:8080;
    server_name unikcomunication.com www.unikcomunication.com;

    root /var/www/unik/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 40m;

    # --- security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Content-Security-Policy $unik_csp always;
    # Mode staging: hapus tanda # di bawah, dan hapus lagi saat go-live
    # add_header X-Robots-Tag "noindex, nofollow" always;

    # --- kompresi ---
    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # --- routing Laravel ---
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # robots.txt dan sitemap.xml dibuat oleh Laravel (file statis harus tidak ada)
    location = /favicon.ico { access_log off; log_not_found off; }

    # hanya index.php yang boleh dieksekusi PHP
    location = /index.php {
        fastcgi_pass 127.0.0.1:9000;                       # PHP-FPM berjalan di container Docker (docker-compose.yml)
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS on;                          # semua trafik publik sudah HTTPS lewat Cloudflare
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }
    location ~ \.php$ { return 404; }

    # file tersembunyi dan file sensitif
    location ~ /\.(?!well-known) { return 404; }
    location ~* ^/(composer\.(json|lock)|package(-lock)?\.json|artisan|phpunit\.xml|vite\.config\.js)$ { return 404; }

    # upload dari admin: jangan pernah dieksekusi/ditampilkan sebagai kode
    location ~* ^/storage/.*\.(php|phtml|html?|svg|js)$ { return 404; }

    # cache gambar
    location ~* \.(?:jpg|jpeg|png|webp|gif|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

}
